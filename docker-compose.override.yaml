# Adds the optional nginx reverse-proxy/cache in front of mapproxy and
# tileservergl. Docker Compose merges this file automatically whenever you
# run `docker compose ...` without explicit -f flags, so plain
# `docker compose up -d` includes nginx exactly as before.
#
# If you're fronting this stack with something else that speaks HTTP
# directly to the backends -- e.g. an AWS ALB and/or CloudFront -- skip this
# file by passing explicit -f flags (deploy.sh does this via --no-nginx):
#
#   docker compose -f docker-compose.yaml up -d
#
# See README.md for the ALB/CloudFront routing this replaces.

# Log rotation, as in docker-compose.yaml (YAML anchors don't cross files).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    # Pinned to the stable branch; plain "alpine" tracks nginx mainline.
    image: nginx:1.30-alpine
    container_name: nginx
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${NGINX_PORT:-8082}:8082"
    volumes:
      - ./nginx/config/nginx.conf:/etc/nginx/nginx.conf:ro
      # The tile cache (see nginx.conf) -- kept on the host so it survives
      # container restarts; deploy.sh --refresh / deploy.ps1 -Refresh empty it.
      - ./nginx/cache:/var/cache/nginx
    # Logs aren't mounted: the image sends them to stdout/stderr, so read
    # them with `docker compose logs nginx`.
    depends_on:
      mapproxy:
        condition: service_healthy
    shm_size: ${NGINX_SHM_SIZE:-1gb}
    restart: unless-stopped
    logging: *logging
    networks:
      - rbt-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
