apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rbt.fullname" . }}-mapproxy
  labels:
    {{- include "rbt.labels" . | nindent 4 }}
    app.kubernetes.io/component: mapproxy
spec:
  replicas: {{ .Values.mapproxy.replicaCount }}
  selector:
    matchLabels:
      {{- include "rbt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mapproxy
  template:
    metadata:
      labels:
        {{- include "rbt.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mapproxy
      annotations:
        # Rolls the pod whenever the ConfigMap changes: MapProxy reloads an
        # edited mapproxy.yaml by itself, but uwsgi.ini and logging.ini are
        # only read at startup.
        checksum/config: {{ include (print $.Template.BasePath "/configmap-mapproxy.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mapproxy
          image: "{{ .Values.mapproxy.image.repository }}:{{ .Values.mapproxy.image.tag }}"
          imagePullPolicy: {{ .Values.mapproxy.image.pullPolicy }}
          # Kubernetes' "command" replaces the image's ENTRYPOINT (the
          # micromamba base image's env-activation script), whereas Compose's
          # `command:` only replaces CMD. Dockerfile.mapproxy sets PATH,
          # PROJ_DATA and GDAL_DATA so uwsgi runs the same without that
          # activation.
          command: ["uwsgi", "--ini", "/mapproxy/config/uwsgi.ini"]
          env:
            - name: HOME
              value: /tmp
            - name: UWSGI_PROCESSES
              value: {{ .Values.mapproxy.uwsgi.processes | quote }}
            - name: UWSGI_THREADS
              value: {{ .Values.mapproxy.uwsgi.threads | quote }}
            - name: UWSGI_CHEAPER
              value: {{ .Values.mapproxy.uwsgi.cheaper | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.mapproxy.containerPort }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: mapproxy-config
              mountPath: /mapproxy/config
              readOnly: true
            - name: cache
              mountPath: /data
              subPath: data
            - name: cache
              mountPath: /locks
              subPath: locks
            - name: cache
              mountPath: /tile_locks
              subPath: tile_locks
            - name: dshm
              mountPath: /dev/shm
          # MapProxy's start page only answers 200 once a uWSGI worker has
          # loaded the config (the Compose healthcheck requests the same
          # page); a TCP connect would pass as soon as the master listens.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          # Liveness stays a TCP check: it only needs to catch a dead master
          # (uWSGI already restarts stuck workers via harakiri), and an HTTP
          # check could time out while every worker is busy under load and
          # restart a healthy pod.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.mapproxy.resources | nindent 12 }}
      volumes:
        - name: mapproxy-config
          configMap:
            name: {{ include "rbt.fullname" . }}-mapproxy-config
        # MapProxy's cache directories. Every cache sets disable_storage, so
        # only lock files are written here -- no tiles.
        - name: cache
          emptyDir: {}
        # docker-compose.yaml's `shm_size: ${MAPPROXY_SHM_SIZE:-2gb}`.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.mapproxy.shm.sizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
