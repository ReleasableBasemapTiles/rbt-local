{{/*
One Deployment+Service+PVC+Route set per enabled entry in
.Values.tileservers (see values.yaml) -- currently epsg3857 and epsg4087,
mirroring the Compose "tileservergl" (docker-compose.yaml) and
"tileservergl4087" (docker-compose.4087.yaml) services. See templates/_tileserver.tpl for what actually gets rendered.
*/}}
{{- range $key, $cfg := .Values.tileservers }}
{{- if $cfg.enabled }}
{{ include "rbt.tileserver" (dict "root" $ "key" $key "cfg" $cfg) }}
{{- end }}
{{- end }}
