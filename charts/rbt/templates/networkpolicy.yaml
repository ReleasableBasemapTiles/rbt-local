{{/*
Off by default (networkPolicy.enabled=false) -- this is a starting point,
not a hardened default. NetworkPolicies are additive -- a pod accepts
whatever any policy selecting it allows -- so this renders one policy per
rule:

- "<fullname>": every pod in this release accepts traffic from the
  release's own pods (mapproxy -> tileservers, `helm test` -> mapproxy).
- "<fullname>-mapproxy": MapProxy's port is open to any source. It's the
  stack's entry point, reached through its Route or by in-cluster clients.
- "<fullname>-<key>": for each tileserver with route.enabled, its port is
  open to any source too.

Why "any source" for Route-exposed ports: OpenShift Routes deliver traffic
as ordinary ingress from the cluster's router, and the router namespace's
labels aren't a stable, version-independent API to `podSelector`-match.
Those ports are already public through their Route, so this doesn't weaken
anything. What the policies add: every other port -- e.g. the EPSG:4087
tileserver's, route-disabled by default -- is reachable only from this
release's own pods, not from arbitrary pods elsewhere in the cluster.
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "rbt.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "rbt.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rbt.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "rbt.selectorLabels" . | nindent 14 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-mapproxy
  labels:
    {{- include "rbt.labels" . | nindent 4 }}
    app.kubernetes.io/component: mapproxy
spec:
  podSelector:
    matchLabels:
      {{- include "rbt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mapproxy
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.mapproxy.containerPort }}
          protocol: TCP
{{- range $key, $cfg := .Values.tileservers }}
{{- if and $cfg.enabled $cfg.route.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ $key }}
  labels:
    {{- include "rbt.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $key }}
spec:
  podSelector:
    matchLabels:
      {{- include "rbt.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $key }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ $cfg.containerPort }}
          protocol: TCP
{{- end }}
{{- end }}
{{- end }}
