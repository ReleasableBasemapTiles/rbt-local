{{/*
MapProxy's config, mounted at /mapproxy/config (see deployment-mapproxy.yaml).
The image loads /mapproxy/config/mapproxy.yaml, so that key always holds the
config for this release's stack:

- tileservers.epsg4087.enabled: files/mapproxy/mapproxy.4087.yaml, the
  EPSG:4087 overlay, which includes the plain config via `base:`. The plain
  config ships as mapproxy.base.yaml, and the overlay's `base: mapproxy.yaml`
  line is rewritten to match. Compose points the image's MAPPROXY_CONFIG at
  mapproxy.4087.yaml instead, but an older image on a node (the tag is reused
  and pulled IfNotPresent) ignores MAPPROXY_CONFIG and would silently serve
  the plain config -- this layout works with either image.
- otherwise: files/mapproxy/mapproxy.yaml, the plain config.

Both files hardcode their TileserverGL source URLs as
http://tileservergl:8080/... and http://tileservergl4087:8080/..., the
hostnames and ports docker-compose.yaml and docker-compose.4087.yaml give
those services. This chart names and ports its Services from
tileservers.<key>.serviceName/containerPort instead, so both origins are
rewritten to match. Each file contains only one of the two, so running both
replacements on each is harmless.
*/}}
{{- $epsg3857 := .Values.tileservers.epsg3857 }}
{{- $epsg4087 := .Values.tileservers.epsg4087 }}
{{- $configs := dict }}
{{- $plain := .Files.Get "files/mapproxy/mapproxy.yaml" }}
{{- if $epsg4087.enabled }}
{{- $overlay := .Files.Get "files/mapproxy/mapproxy.4087.yaml" }}
{{- $rebased := regexReplaceAll "(?m)^base: mapproxy\\.yaml(\r?)$" $overlay "base: mapproxy.base.yaml${1}" }}
{{- if eq $rebased $overlay }}
{{- fail "files/mapproxy/mapproxy.4087.yaml has no `base: mapproxy.yaml` line for templates/configmap-mapproxy.yaml to rewrite" }}
{{- end }}
{{- $_ := set $configs "mapproxy.yaml" $rebased }}
{{- $_ := set $configs "mapproxy.base.yaml" $plain }}
{{- else }}
{{- $_ := set $configs "mapproxy.yaml" $plain }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rbt.fullname" . }}-mapproxy-config
  labels:
    {{- include "rbt.labels" . | nindent 4 }}
    app.kubernetes.io/component: mapproxy
data:
{{- range $name, $config := $configs }}
{{- $config = $config | replace "http://tileservergl4087:8080" (printf "http://%s:%v" $epsg4087.serviceName $epsg4087.containerPort) }}
{{- $config = $config | replace "http://tileservergl:8080" (printf "http://%s:%v" $epsg3857.serviceName $epsg3857.containerPort) }}
  {{ $name }}: |
{{ $config | indent 4 }}
{{- end }}
  uwsgi.ini: |
{{ .Files.Get "files/mapproxy/uwsgi.ini" | indent 4 }}
  logging.ini: |
{{ .Files.Get "files/mapproxy/logging.ini" | indent 4 }}
