[uwsgi]
chdir = /mapproxy
wsgi-file = /mapproxy/app.py
; http-socket (uWSGI's built-in HTTP router) rather than the raw uwsgi wire
; protocol (socket) -- this lets mapproxy be reached directly over plain
; HTTP, either by nginx's proxy_pass (see nginx/config/nginx.conf) or by an
; AWS ALB/CloudFront target when running without nginx (see deploy.sh --no-nginx).
http-socket = 0.0.0.0:5000
master = true
; Exit instead of serving errors when MapProxy can't load its config, so the
; failure shows up as a restarting container rather than a "healthy" one.
need-app = true
; UWSGI_PROCESSES/UWSGI_THREADS/UWSGI_CHEAPER are set in docker-compose.yaml
; (see .env.example); Dockerfile.mapproxy has defaults.
processes = $(UWSGI_PROCESSES)
threads = $(UWSGI_THREADS)
vacuum = true
max-requests = 20000
harakiri = 75
post-buffering = 65536
buffer-size = 65536
socket-timeout = 30
thunder-lock = true
enable-threads = true
lazy-apps = true
listen = 4096
; Workers kept running when idle; the busyness algorithm below adds more
; under load, up to `processes`. Must be lower than UWSGI_PROCESSES (uWSGI
; refuses to start otherwise); 0 keeps every worker running.
cheaper = $(UWSGI_CHEAPER)
cheaper-algo = busyness
cheaper-step = 2
cheaper-overload = 2
cheaper-busyness-multiplier = 30
cheaper-busyness-min = 20
cheaper-busyness-max = 80
cheaper-busyness-backlog-alert = 16
cheaper-busyness-backlog-step = 2
memory-report = true
; Log only slow (>200ms), 4xx and 5xx requests: uWSGI ignores the three
; log-* options below unless disable-logging turns off per-request logging.
; With the nginx service in front, its access log still has every request.
; Comment out disable-logging to log them all here too.
disable-logging = true
log-slow = 200
log-4xx = true
log-5xx = true
; Per-process memory limits in MB. limit-as caps each worker's address
; space; reload-on-rss restarts a worker after a request that leaves it
; using more than 2048MB. Worst case is about UWSGI_PROCESSES x 2048MB --
; 16GB with the default 8 workers -- so lower one or both on a smaller host.
limit-as = 4096
reload-on-rss = 2048
worker-reload-mercy = 30
die-on-term = true
