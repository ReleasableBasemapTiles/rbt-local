# Sibling of mapproxy.yaml, used only by docker-compose.4087.yaml (see its
# mapproxy service's `command`, which points uwsgi at this file instead).
# Everything here is identical to mapproxy.yaml except the EPSG:4326 caches'
# source and the addition of the EPSG:4087 sources/caches/grid that feed
# them -- see the "EPSG:4087" comments below for the deltas. Because this is
# a full standalone copy rather than a `base:` include, any future change to
# a shared section (layers, the 3857/3395 caches and sources, globals) needs
# to be mirrored here by hand.
services:
  wmts:
    restful: true
    kvp: false
    md:
      title: RBT WMTS
  wms:
    # Without EPSG:3395 here, WMS GetMap rejects the world_mercator layers
    # with InvalidSRS even though WMTS serves them fine. Setting `srs`
    # *replaces* MapProxy's default list rather than adding to it, so the
    # five defaults are repeated alongside it. EPSG:3395 is easting/northing
    # like EPSG:3857, so it needs no globals.srs.axis_order_* entry.
    srs: ["CRS:84", "EPSG:4326", "EPSG:4258", "EPSG:3857", "EPSG:900913", "EPSG:3395"]
    md:
      title: RBT WMS

layers:
  - name: rbt_topo_3857
    title: rbt_topo_3857
    sources: [rbt_topo_3857_cache]
  - name: rbt_light_3857
    title: rbt_light_3857
    sources: [rbt_light_3857_cache]
  - name: rbt_brown_3857
    title: rbt_brown_3857
    sources: [rbt_brown_3857_cache]
  - name: rbt_gray_3857
    title: rbt_gray_3857
    sources: [rbt_gray_3857_cache]
  - name: rbt_dark_3857
    title: rbt_dark_3857
    sources: [rbt_dark_3857_cache]
  - name: rbt_overlay_3857
    title: rbt_overlay_3857
    sources: [rbt_overlay_3857_cache]
  - name: rbt_topo_3395
    title: rbt_topo_3395
    sources: [rbt_topo_3395_cache]
  - name: rbt_light_3395
    title: rbt_light_3395
    sources: [rbt_light_3395_cache]
  - name: rbt_brown_3395
    title: rbt_brown_3395
    sources: [rbt_brown_3395_cache]
  - name: rbt_gray_3395
    title: rbt_gray_3395
    sources: [rbt_gray_3395_cache]
  - name: rbt_dark_3395
    title: rbt_dark_3395
    sources: [rbt_dark_3395_cache]
  - name: rbt_overlay_3395
    title: rbt_overlay_3395
    sources: [rbt_overlay_3395_cache]
  - name: rbt_topo_4326
    title: rbt_topo_4326
    sources: [rbt_topo_4326_cache]
  - name: rbt_light_4326
    title: rbt_light_4326
    sources: [rbt_light_4326_cache]
  - name: rbt_brown_4326
    title: rbt_brown_4326
    sources: [rbt_brown_4326_cache]
  - name: rbt_gray_4326
    title: rbt_gray_4326
    sources: [rbt_gray_4326_cache]
  - name: rbt_dark_4326
    title: rbt_dark_4326
    sources: [rbt_dark_4326_cache]
  - name: rbt_overlay_4326
    title: rbt_overlay_4326
    sources: [rbt_overlay_4326_cache]

caches:
  rbt_topo_3857_cache:
    sources: [rbt_topo_source]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [webmercator]
    disable_storage: true
  rbt_light_3857_cache:
    sources: [rbt_light_source]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [webmercator]
    disable_storage: true
  rbt_brown_3857_cache:
    sources: [rbt_brown_source]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [webmercator]
    disable_storage: true
  rbt_gray_3857_cache:
    sources: [rbt_gray_source]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [webmercator]
    disable_storage: true
  rbt_dark_3857_cache:
    sources: [rbt_dark_source]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [webmercator]
    disable_storage: true
  rbt_overlay_3857_cache:
    sources: [rbt_overlay_source]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [webmercator]
    disable_storage: true
  # EPSG:3395 has no native tile source -- these reproject on the fly from
  # the corresponding EPSG:3857 cache above (MapProxy's "cache as source"
  # feature), rather than fetching TileserverGL a second time.
  rbt_topo_3395_cache:
    sources: [rbt_topo_3857_cache]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [world_mercator]
    disable_storage: true
  rbt_light_3395_cache:
    sources: [rbt_light_3857_cache]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [world_mercator]
    disable_storage: true
  rbt_brown_3395_cache:
    sources: [rbt_brown_3857_cache]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [world_mercator]
    disable_storage: true
  rbt_gray_3395_cache:
    sources: [rbt_gray_3857_cache]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [world_mercator]
    disable_storage: true
  rbt_dark_3395_cache:
    sources: [rbt_dark_3857_cache]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [world_mercator]
    disable_storage: true
  rbt_overlay_3395_cache:
    sources: [rbt_overlay_3857_cache]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [world_mercator]
    disable_storage: true
  # EPSG:4087 has its own native tile source (the second TileserverGL
  # container, tileservergl4087) -- these are the "cache as source" bases
  # for the EPSG:4326 caches below, replacing the EPSG:3857-sourced
  # reprojection mapproxy.yaml uses. EPSG:4087 (World Equidistant
  # Cylindrical) shares EPSG:4326's linear lat/lon scaling, so this
  # reprojection is a pure unit conversion with no resampling distortion,
  # unlike reprojecting from the angularly-distorted EPSG:3857 cache.
  rbt_topo_4087_cache:
    sources: [rbt_topo_4087_source]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [equidistant_4087]
    disable_storage: true
  rbt_light_4087_cache:
    sources: [rbt_light_4087_source]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [equidistant_4087]
    disable_storage: true
  rbt_brown_4087_cache:
    sources: [rbt_brown_4087_source]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [equidistant_4087]
    disable_storage: true
  rbt_gray_4087_cache:
    sources: [rbt_gray_4087_source]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [equidistant_4087]
    disable_storage: true
  rbt_dark_4087_cache:
    sources: [rbt_dark_4087_source]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [equidistant_4087]
    disable_storage: true
  rbt_overlay_4087_cache:
    sources: [rbt_overlay_4087_source]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [equidistant_4087]
    disable_storage: true
  # EPSG:4326 has no native tile source -- these reproject on the fly from
  # the corresponding EPSG:4087 cache above (MapProxy's "cache as source"
  # feature) instead of the EPSG:3857 cache mapproxy.yaml uses, since
  # EPSG:4087 to EPSG:4326 is a straight unit-scale reprojection (see the
  # comment on the EPSG:4087 caches above), while EPSG:3857 to EPSG:4326
  # resamples nonlinearly away from the equator.
  rbt_topo_4326_cache:
    sources: [rbt_topo_4087_cache]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [geodetic]
    disable_storage: true
  rbt_light_4326_cache:
    sources: [rbt_light_4087_cache]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [geodetic]
    disable_storage: true
  rbt_brown_4326_cache:
    sources: [rbt_brown_4087_cache]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [geodetic]
    disable_storage: true
  rbt_gray_4326_cache:
    sources: [rbt_gray_4087_cache]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [geodetic]
    disable_storage: true
  rbt_dark_4326_cache:
    sources: [rbt_dark_4087_cache]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [geodetic]
    disable_storage: true
  rbt_overlay_4326_cache:
    sources: [rbt_overlay_4087_cache]
    format: mixed
    request_format: image/png
    minimize_meta_requests: true
    grids: [geodetic]
    disable_storage: true

sources:
  rbt_topo_source:
    type: tile
    # Local TileserverGL container, EPSG:3857 (Web Mercator)
    url: http://tileservergl:8080/styles/RBT-TOPO/512/%(z)s/%(x)s/%(y)s.png
    grid: webmercator
  # The three canvas styles (RBT-CANVAS-LIGHT/-BROWN/-GRAY in their
  # style.json ids) are opaque basemaps like topo and dark, so they need no
  # `transparent: true` -- only rbt_overlay_source below is drawn over imagery.
  rbt_light_source:
    type: tile
    # Local TileserverGL container, EPSG:3857 (Web Mercator)
    url: http://tileservergl:8080/styles/RBT-LIGHT/512/%(z)s/%(x)s/%(y)s.png
    grid: webmercator
  rbt_brown_source:
    type: tile
    # Local TileserverGL container, EPSG:3857 (Web Mercator)
    url: http://tileservergl:8080/styles/RBT-BROWN/512/%(z)s/%(x)s/%(y)s.png
    grid: webmercator
  rbt_gray_source:
    type: tile
    # Local TileserverGL container, EPSG:3857 (Web Mercator)
    url: http://tileservergl:8080/styles/RBT-GRAY/512/%(z)s/%(x)s/%(y)s.png
    grid: webmercator
  rbt_dark_source:
    type: tile
    # Local TileserverGL container, EPSG:3857 (Web Mercator)
    url: http://tileservergl:8080/styles/RBT-DARK/512/%(z)s/%(x)s/%(y)s.png
    grid: webmercator
  rbt_overlay_source:
    type: tile
    # Local TileserverGL container, EPSG:3857 (Web Mercator)
    url: http://tileservergl:8080/styles/RBT-OVERLAY/512/%(z)s/%(x)s/%(y)s.png
    grid: webmercator
    transparent: true
  # EPSG:4087 -- second TileserverGL container (tileservergl4087), which
  # mounts tileserver/data/4087 instead of tileserver/data/3857 but shares
  # the same tileserver/fonts and tileserver/styles as the EPSG:3857
  # container above (see docker-compose.4087.yaml).
  rbt_topo_4087_source:
    type: tile
    url: http://tileservergl4087:8080/styles/RBT-TOPO/512/%(z)s/%(x)s/%(y)s.png
    grid: equidistant_4087
  rbt_light_4087_source:
    type: tile
    url: http://tileservergl4087:8080/styles/RBT-LIGHT/512/%(z)s/%(x)s/%(y)s.png
    grid: equidistant_4087
  rbt_brown_4087_source:
    type: tile
    url: http://tileservergl4087:8080/styles/RBT-BROWN/512/%(z)s/%(x)s/%(y)s.png
    grid: equidistant_4087
  rbt_gray_4087_source:
    type: tile
    url: http://tileservergl4087:8080/styles/RBT-GRAY/512/%(z)s/%(x)s/%(y)s.png
    grid: equidistant_4087
  rbt_dark_4087_source:
    type: tile
    url: http://tileservergl4087:8080/styles/RBT-DARK/512/%(z)s/%(x)s/%(y)s.png
    grid: equidistant_4087
  rbt_overlay_4087_source:
    type: tile
    url: http://tileservergl4087:8080/styles/RBT-OVERLAY/512/%(z)s/%(x)s/%(y)s.png
    grid: equidistant_4087
    transparent: true

grids:
  webmercator:
    base: GLOBAL_WEBMERCATOR
    srs: EPSG:3857
    origin: nw
    tile_size: [512, 512]
    bbox:
      [
        -20037508.342789244,
        -20037508.342789244,
        20037508.342789244,
        20037508.342789244
      ]
  # EPSG:3395 (World Mercator) is ellipsoidal, not spherical like EPSG:3857,
  # so it has no GLOBAL_* base grid to derive from -- bbox_srs lets MapProxy
  # compute the native bbox from the EPSG:3395 valid area (80S-84N) itself.
  world_mercator:
    srs: EPSG:3395
    origin: nw
    tile_size: [512, 512]
    bbox: [-180, -80, 180, 84]
    bbox_srs: EPSG:4326
  # The EPSG:4087 MBTiles are tiled on the same square pyramid Web Mercator
  # uses -- x and y both span +/-20037508.342789244 m -- so the world's real
  # +/-10018754.171394622 m vertical extent fills only the middle half of
  # each level-0 tile. That is fine: the only consumer is the geodetic
  # caches below, whose requests never reach past +/-90 latitude. There is
  # no GLOBAL_* base grid for EPSG:4087, so num_levels is set explicitly
  # instead of relying on a base grid's default.
  equidistant_4087:
    srs: EPSG:4087
    origin: nw
    tile_size: [512, 512]
    bbox:
      [
        -20037508.342789244,
        -20037508.342789244,
        20037508.342789244,
        20037508.342789244
      ]
    num_levels: 20
  # EPSG:4326 (WGS 84 / geographic) has no native tile source -- like
  # world_mercator, this reprojects on the fly, but from the corresponding
  # EPSG:4087 cache above (mapproxy.yaml reprojects from EPSG:3857 instead).
  # GLOBAL_GEODETIC's default origin is sw, but MapProxy's WMTS service
  # silently skips any grid whose origin isn't nw-compatible, so origin is
  # overridden to nw here to match the other grids and ensure WMTS actually
  # serves it. EPSG:4326 is lat/lon, but MapProxy (with pyproj>=2)
  # auto-derives axis order from the CRS itself, so no
  # globals.srs.axis_order_* entry is needed here either.
  geodetic:
    base: GLOBAL_GEODETIC
    srs: EPSG:4326
    origin: nw
    tile_size: [512, 512]
    bbox: [-180, -90, 180, 90]

globals:
  http:
    ssl_no_cert_checks: true
  image:
    resampling_method: bicubic
    paletted: false
  cache:
    base_dir: /data
    lock_dir: /locks
    tile_lock_dir: /tile_locks
    meta_size: [1, 1]
    concurrent_tile_creators: 8
    meta_buffer: 0
    bulk_meta_tiles: true
