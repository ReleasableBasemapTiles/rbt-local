# Package charts/rbt and push it to this repository's GHCR as an OCI
# artifact. helm push infers name/tag from Chart.yaml (rbt / 0.1.0):
#   oci://ghcr.io/releasablebasemaptile/rbt-local/rbt:0.2.0
#
#   helm install rbt oci://ghcr.io/releasablebasemaptile/rbt-local/rbt --version 0.2.0
#
# This repo is private, so the package is private -- `helm registry login
# ghcr.io` with a PAT that has `read:packages` before install.
#
#   gh workflow run helm-chart.yml

name: Helm chart

on:
  push:
    branches: [main]
    paths:
      - charts/rbt/**
      - mapproxy/config/**
      - tileserver/config/config.json
      - .github/workflows/helm-chart.yml
  workflow_dispatch:

concurrency:
  group: helm-chart-${{ github.ref }}
  cancel-in-progress: true

env:
  # helm push appends /<chart-name>:<version>; GHCR requires lowercase.
  REGISTRY: ghcr.io

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Confirm chart files match repo configs
        run: ./charts/rbt/sync-files.sh --check

      - name: Lint and render
        run: |
          helm lint charts/rbt
          helm template ci charts/rbt \
            --set s3.fontsUri=s3://ci/fonts \
            --set s3.stylesUri=s3://ci/styles

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push
        run: |
          set -euo pipefail
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          dest="oci://${{ env.REGISTRY }}/${repo}"
          helm package charts/rbt --destination "${RUNNER_TEMP}"
          chart="$(ls "${RUNNER_TEMP}"/rbt-*.tgz)"
          helm push "${chart}" "${dest}"
