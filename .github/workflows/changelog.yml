# Regenerate CHANGELOG.md from Conventional Commits via git-cliff, then
# rebuild the docs site, whose Release notes page is made from that file.
# Runs on pushes to main and on v* tags. The bot pushes its commit with
# GITHUB_TOKEN, which starts no workflows, so this one does not loop. The
# commit carries no [skip ci]: a release tag usually lands on it, and that
# marker would stop the tag's run.

name: Changelog

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --offline
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changelog
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "CHANGELOG.md is already up to date"
            exit 0
          fi
          git commit -m "chore(changelog): update CHANGELOG.md"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

  # Pages built the pushed commit, which predates the changelog commit, and
  # GITHUB_TOKEN pushes start no workflows; workflow_dispatch is the
  # exception. Dispatch even when CHANGELOG.md was already current. After two
  # quick merges, the first update can commit both entries, and a late Pages
  # run for the second merge can then replace the run it dispatched.
  republish-docs:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rebuild the docs site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
