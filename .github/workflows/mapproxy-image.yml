# Build Dockerfile.mapproxy and push to this repository's GHCR:
#   ghcr.io/releasablebasemaptiles/rbt-local/mapproxy
#
# Triggers on changes to the image inputs, and on workflow_dispatch so a
# branch can publish before merge. linux/amd64 + linux/arm64 (same pair
# the rest of this stack documents). Whether OpenShift/Kubernetes needs
# imagePullSecrets to pull the package is set by the package's own visibility
# on GitHub (Packages -> Package settings), not by this repo being public.
# Pull requests that change the image inputs only build it, for
# linux/amd64, which also runs the Dockerfile's smoke tests.
#
# The image inputs are the files Dockerfile.mapproxy COPYs, plus the
# Dockerfile, .dockerignore (it decides what the build can see) and this file.
# mapproxy/environment.yml is deliberately not one: the image installs the
# conda packages in mapproxy/conda-*.lock, so editing environment.yml changes
# nothing that ships until the lock files are regenerated -- which
# check-sync.py makes a dependency change do -- and a comment edit must not
# republish the image. check-sync.py also keeps these paths in step with the
# Dockerfile's COPY lines.
#
#   gh workflow run mapproxy-image.yml

name: MapProxy image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.mapproxy
      - .dockerignore
      - mapproxy/conda-linux-64.lock
      - mapproxy/conda-linux-aarch64.lock
      - mapproxy/docker/app.py
      - mapproxy/docker/mesh_guard.py
      - .github/workflows/mapproxy-image.yml
  pull_request:
    paths:
      - Dockerfile.mapproxy
      - .dockerignore
      - mapproxy/conda-linux-64.lock
      - mapproxy/conda-linux-aarch64.lock
      - mapproxy/docker/app.py
      - mapproxy/docker/mesh_guard.py
      - .github/workflows/mapproxy-image.yml
  workflow_dispatch:

concurrency:
  group: mapproxy-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # metadata-action lowercases this; GHCR requires lowercase names.
  IMAGE: ghcr.io/${{ github.repository }}/mapproxy

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mapproxy
          platforms: linux/amd64
          push: false
          cache-from: type=gha

  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The version tag comes from the Dockerfile, so bumping MapProxy is a
      # one-line change that can't leave this tag behind.
      - name: Read the MapProxy version
        id: version
        run: |
          version="$(sed -n 's/^ARG MAPPROXY_VERSION=//p' Dockerfile.mapproxy)"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not read ARG MAPPROXY_VERSION from Dockerfile.mapproxy (got '$version')"
            exit 1
          fi
          echo "mapproxy=$version" >> "$GITHUB_OUTPUT"

      # The version tag (8.1.0 today) is the one the Helm chart deploys
      # (charts/rbt/values.yaml), so only main moves it; a branch run
      # publishes its branch and sha tags.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.mapproxy }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mapproxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
