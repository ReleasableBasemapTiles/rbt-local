# Optional reverse proxy + tile cache in front of MapProxy and TileserverGL
# (added by docker-compose.override.yaml). Routes:
#   /mapproxy/...          -> mapproxy:5000 (prefix stripped)
#   /tileservergl/...      -> tileservergl:8080 (prefix stripped)
#   /tileservergl4087/...  -> tileservergl4087:8080 (docker-compose.4087.yaml only)
#   /healthz               -> nginx's own liveness check
#   /...                   -> mapproxy:5000 (unprefixed, for older client configs)

worker_rlimit_nofile 65536;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
  worker_connections 8192;
  multi_accept on;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'cache=$upstream_cache_status rt=$request_time';

  # The official nginx image links both log files to the container's
  # stdout/stderr, so they show up in `docker compose logs nginx`.
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 60;
  types_hash_max_size 4096;
  server_tokens off;

  # Docker's embedded DNS. Every proxy_pass below names its backend through a
  # variable, which makes nginx resolve it at request time (re-checked every
  # 10s) rather than once at startup. So a recreated backend container's new
  # address is picked up without restarting nginx, and the tileservergl4087
  # backend, which only exists in the docker-compose.4087.yaml stack, doesn't
  # stop nginx from starting in the other stacks -- it just 502s there.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # ---------------------------------------------------------------------------
  # Tile cache
  #
  # MapProxy runs as a pass-through (disable_storage in mapproxy.yaml) and
  # TileserverGL renders on demand, so this is the stack's only tile cache.
  # nginx owns the cache lifetime: map images are kept for 30 days whatever
  # the backend's own Cache-Control says. Nothing here can tell when the
  # MBTiles or styles behind a tile change -- deploy.sh --refresh /
  # deploy.ps1 -Refresh empties the cache (and runs automatically after a
  # download that fetched new data).
  #
  # 64m of keys holds ~500k entries, comfortably more than 10g of tiles.
  # ---------------------------------------------------------------------------
  proxy_cache_path /var/cache/nginx/tile_cache
                  levels=1:2
                  max_size=10g
                  inactive=30d
                  use_temp_path=off
                  keys_zone=backend_cache:64m;

  # Only map images are cached: tile and static-map URLs ending in an image
  # extension, plus WMS GetMap/GetLegendGraphic. Everything else --
  # capabilities XML, TileJSON, styles, fonts, vector tiles, HTML -- either
  # embeds this server's own URL or is cheap to serve, so it bypasses the
  # cache (and the cache lock, which would otherwise queue identical
  # concurrent requests one behind another).
  map $uri $rbt_image_path {
    ~*\.(png|jpe?g|webp)$ 1;
    default               0;
  }
  map "$rbt_image_path:$arg_request" $rbt_not_image_request {
    ~^1:                            0;
    ~*^0:(getmap|getlegendgraphic)$ 0;
    default                         1;
  }

  # WMS EXCEPTIONS=inimage/blank reports errors -- e.g. a backend that's
  # still starting -- as an ordinary HTTP 200 image, so those requests are
  # never cached.
  map $arg_exceptions $rbt_image_exceptions {
    ~*(inimage|blank) 1;
    default           0;
  }

  # Response-side guards: cache only a 200 image response, and never one the
  # backend marked no-store (MapProxy does for partial renders while a source
  # is failing). `volatile` so they're evaluated when proxy_no_cache checks
  # them, after the response has arrived, never reused from an earlier lookup.
  map $upstream_http_content_type $rbt_not_image_response {
    volatile;
    ~^image/ 0;
    default  1;
  }
  map $upstream_http_cache_control $rbt_no_store {
    volatile;
    ~*no-store 1;
    default    0;
  }

  gzip on;
  gzip_vary on;
  gzip_proxied any; # Compress for all proxied requests
  gzip_comp_level 6; # Balance between CPU and compression ratio (1-9)
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_min_length 256; # Don't compress very small files
  # No image/png or image/jpeg here: both are already compressed.
  gzip_types
    application/atom+xml
    application/geo+json
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rdf+xml
    application/rss+xml
    application/vnd.ms-fontobject
    application/wasm
    application/x-protobuf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/eot
    font/otf
    font/ttf
    image/bmp
    image/svg+xml
    image/x-icon
    text/cache-manifest
    text/calendar
    text/css
    text/javascript
    text/plain
    text/markdown
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/xml;

  server {
    listen 8082;
    server_name _;

    # Set by each prefixed location below to the path prefix it strips, and
    # handed back to the backend so the URLs it generates (capabilities,
    # TileJSON, viewer links) keep that prefix: MapProxy reads X-Script-Name
    # (https://mapproxy.github.io/mapproxy/latest/deployment.html) and
    # TileserverGL reads X-Forwarded-Path; each ignores the other's header.
    # nginx omits a header whose value is empty, so "/" sends neither.
    set $rbt_prefix "";

    # All proxy settings live here at server level and are inherited by every
    # location. Don't add a proxy_set_header inside a location: any one there
    # silently discards *all* of these for that location.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Script-Name $rbt_prefix;
    proxy_set_header X-Forwarded-Path $rbt_prefix;

    # No upstream keepalive: MapProxy's uWSGI http-socket closes every
    # connection after one response anyway (see mapproxy/config/uwsgi.ini).
    proxy_buffering on;
    proxy_buffer_size 32k;
    proxy_buffers 16 32k;
    proxy_busy_buffers_size 64k;
    proxy_connect_timeout 5s;
    proxy_send_timeout 65s;
    # Above uWSGI's 75s harakiri, so a stuck MapProxy worker is killed and
    # reported by uWSGI rather than timed out here first.
    proxy_read_timeout 80s;

    proxy_cache backend_cache;
    # $request_uri keeps the location prefix, so the backends never share
    # entries. Leaving out the scheme, host, and method is safe because only
    # images are stored, and lets every hostname (and HEAD alongside GET)
    # share one entry per tile.
    proxy_cache_key $request_uri;
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_valid 200 30d;
    proxy_cache_bypass $rbt_not_image_request $rbt_image_exceptions;
    proxy_no_cache $rbt_not_image_request $rbt_image_exceptions
                   $rbt_not_image_response $rbt_no_store;
    # One request renders a missing tile while identical ones wait for it
    # (up to 30s -- the default 5s lets slow renders stampede the backends).
    proxy_cache_lock on;
    proxy_cache_lock_timeout 30s;
    proxy_cache_lock_age 30s;
    proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_cache_revalidate on;
    proxy_cache_background_update on;
    # HIT / MISS / EXPIRED / STALE / UPDATING, or BYPASS for non-image
    # requests. `always` adds it to error responses too.
    add_header X-Cache-Status $upstream_cache_status always;

    # In each location, every `set` must come before `rewrite ... break`:
    # break ends the location's rewrite-module directives, so a `set` after
    # it would never run.

    location /mapproxy/ {
      set $rbt_prefix /mapproxy;
      set $rbt_backend mapproxy:5000;
      rewrite ^/mapproxy/(.*) /$1 break;
      proxy_pass http://$rbt_backend;
    }

    location /tileservergl/ {
      set $rbt_prefix /tileservergl;
      set $rbt_backend tileservergl:8080;
      rewrite ^/tileservergl/(.*) /$1 break;
      proxy_pass http://$rbt_backend;
    }

    # Second TileserverGL container (EPSG:4087), only present in the
    # docker-compose.4087.yaml stack -- see the `resolver` directive above.
    location /tileservergl4087/ {
      set $rbt_prefix /tileservergl4087;
      set $rbt_backend tileservergl4087:8080;
      rewrite ^/tileservergl4087/(.*) /$1 break;
      proxy_pass http://$rbt_backend;
    }

    # Default location (backwards compatibility): MapProxy without the
    # /mapproxy/ prefix, so $rbt_prefix stays empty here.
    location / {
      set $rbt_backend mapproxy:5000;
      proxy_pass http://$rbt_backend;
    }

    # Health check endpoint for docker-compose / orchestrator probes
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }
  }
}
