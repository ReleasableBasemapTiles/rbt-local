services:
  mapproxy:
    # Built locally from Dockerfile.mapproxy: Python 3.14 + conda-forge
    # GDAL/PROJ >= 9.8 (ellipsoidal EPSG:4087) + MapProxy 7 + uwsgi.
    # Replaces ghcr.io/mapproxy/mapproxy/mapproxy:7.0.0-nginx, whose
    # Debian Bookworm PROJ 9.1.1 still uses spherical eqc. We run uwsgi
    # directly (this image has no nginx), fronted by our optional nginx
    # service (see docker-compose.override.yaml) and/or published below
    # for an external proxy (e.g. AWS ALB).
    build:
      context: .
      dockerfile: Dockerfile.mapproxy
    image: rbt-mapproxy:7.0.0
    pull_policy: build
    container_name: mapproxy
    command: ["uwsgi", "--ini", "/mapproxy/config/uwsgi.ini"]
    environment:
      - UWSGI_PROCESSES=${UWSGI_PROCESSES:-8}
      - UWSGI_THREADS=${UWSGI_THREADS:-4}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${MAPPROXY_PORT:-8081}:5000"
    volumes:
      - ./mapproxy/config:/mapproxy/config:ro
      - ./mapproxy/data:/data
      - ./mapproxy/locks:/locks
      - ./mapproxy/tile_locks:/tile_locks
    depends_on:
      tileservergl:
        condition: service_healthy
    shm_size: ${MAPPROXY_SHM_SIZE:-2gb}
    restart: unless-stopped
    networks:
      - rbt-network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  tileservergl:
    image: maptiler/tileserver-gl:v5.7.0-pre.1
    container_name: tileservergl
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${TILESERVER_PORT:-8080}:8080"
    volumes:
      # EPSG:3857 (Web Mercator) MBTiles -- see docker-compose.4087.yaml's
      # tileservergl4087 service, which mounts tileserver/data/4087 instead.
      - ./tileserver/data/3857:/data
      - ./tileserver/fonts:/fonts
      - ./tileserver/styles:/styles
      - ./tileserver/config:/config:ro
    command: ["-c", "/config/config.json"]
    restart: unless-stopped
    shm_size: ${TILESERVER_SHM_SIZE:-2gb}
    networks:
      - rbt-network
    healthcheck:
      test: ["CMD", "node", "/usr/src/app/src/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

networks:
  rbt-network:
    driver: bridge
