# Overlay on docker-compose.yaml for the EPSG:4087 stack (see
# docs/deployment-4087.md): adds a second TileserverGL container
# ("tileservergl4087") serving EPSG:4087 MBTiles from tileserver/data/4087,
# with the same tileserver/fonts, tileserver/styles and config.json, and
# points MapProxy at mapproxy/config/mapproxy.4087.yaml, whose EPSG:4326
# caches reproject from those EPSG:4087 tiles instead of the EPSG:3857 ones.
# List it after docker-compose.yaml:
#
#   docker compose -f docker-compose.yaml -f docker-compose.4087.yaml -f docker-compose.override.yaml up -d   # with nginx
#   docker compose -f docker-compose.yaml -f docker-compose.4087.yaml up -d                                   # without nginx
#
# or run `./deploy.sh --4087` / `.\deploy.ps1 -Use4087`, or set COMPOSE_FILE
# in .env (see .env.example) so plain `docker compose ...` picks the files.
# Going back to the default stack leaves tileservergl4087 running as an
# orphan, so switch with `docker compose down --remove-orphans` first.

# Log rotation, as in docker-compose.yaml (YAML anchors don't cross files).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mapproxy:
    environment:
      # Read by the image's /mapproxy/app.py (mapproxy/docker/app.py).
      # mapproxy.4087.yaml includes mapproxy.yaml via `base:`, so both files
      # come from the ./mapproxy/config mount in docker-compose.yaml.
      - MAPPROXY_CONFIG=/mapproxy/config/mapproxy.4087.yaml
    depends_on:
      tileservergl4087:
        condition: service_healthy

  # Same image, fonts, styles and tileserver/config/config.json as
  # "tileservergl" in docker-compose.yaml, but mounting tileserver/data/4087
  # at /data instead of tileserver/data/3857. config.json's mbtiles paths
  # resolve relative to /config, so this is the only difference needed; the
  # EPSG:4087 RBT.mbtiles/TERRAIN.mbtiles must keep those exact filenames.
  tileservergl4087:
    image: maptiler/tileserver-gl:v5.7.0-pre.1
    container_name: tileservergl4087
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${TILESERVER_4087_PORT:-8083}:8080"
    volumes:
      - ./tileserver/data/4087:/data
      - ./tileserver/fonts:/fonts
      - ./tileserver/styles:/styles
      - ./tileserver/config:/config:ro
    command: ["-c", "/config/config.json"]
    restart: unless-stopped
    logging: *logging
    shm_size: ${TILESERVER_SHM_SIZE:-2gb}
    networks:
      - rbt-network
    healthcheck:
      test: ["CMD", "node", "/usr/src/app/src/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
